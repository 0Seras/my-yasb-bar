watch_stylesheet: true
watch_config: true
debug: false
komorebi:
  start_command: "komorebic start --whkd"
  stop_command: "komorebic stop"
  reload_command: "komorebic stop && komorebic start --whkd"
bars:
  status-bar:
    enabled: true
    screens: ["*"]
    class_name: "yasb-bar"
    alignment:
      position: "top"
      center: false
    blur_effect:
      enabled: false
      acrylic: false
      dark_mode: true
      round_corners: false
      border_color: None
    window_flags:
      always_on_top: false
      windows_app_bar: true
    dimensions:
      width: "100%"
      height: 25
    padding:
      top: 0
      left: 0
      bottom: 0
      right: 0
    widgets:
      left: ["clock" , "lines", "komorebi_active_layout", "lines", "komorebi_workspaces", "quick_launch"]
      center: ["media", "cava"]
      right: ["volume", "lines", "wifi", "wallpapers",  "lines", "power_menu"]
widgets:
  clock:
    type: "yasb.clock.ClockWidget"
    options:
      label: "{%H:%M:%S} "
      timezones: []
      callbacks:
        on_left: "do_nothing"
        on_right: "do_nothing"
  komorebi_workspaces:
    type: "komorebi.workspaces.WorkspaceWidget"
    options:
      label_offline: "天 offline"
      label_workspace_btn: "{index}"
      label_workspace_active_btn: "{index}"
      label_workspace_populated_btn: "{index}"
      hide_empty_workspaces: true
  komorebi_active_layout:
    type: "komorebi.active_layout.ActiveLayoutWidget"
    options:
      hide_if_offline: true
      label: "{layout_name}"
      layouts: ['bsp', 'columns', 'rows', 'grid', 'vertical_stack', 'horizontal_stack', 'ultrawide_vertical_stack','right_main_vertical_stack']
      layout_icons:
        bsp: "\uebeb"
        columns: "\uebf7"
        rows: "\uec01"
        grid: "\udb81\udf58"
        scrolling: "\uebf7"
        vertical_stack: "\uebee"
        horizontal_stack: "\uebf0"
        ultrawide_vertical_stack: "\uebee"
        right_main_vertical_stack: "\uebf1"
        monocle: "\uf06f"
        maximized: "\uf06f"
        floating: "\uf2d2"
        paused: "\udb83\udf89"
        tiling: "\udb81\ude40"
      callbacks:
        on_left: 'toggle_layout_menu'
        on_middle: 'next_layout'
        on_right: 'prev_layout'
      layout_menu:
        blur: false
        round_corners: true
        round_corners_type: "normal" ##normal / small
        border_color: "System" ##System / none / Hex color
        alignment: "left" ##left / right / center
        direction: "down" ##up / down
        offset_top: 5
        offset_left: 0
        show_layout_icons: true    
  volume:
    type: "yasb.volume.VolumeWidget"
    options:
      label: "vol {level}"
      callbacks:
        on_right: "toggle_mute"
        on_left: "do_nothing"
  media:
    type: yasb.media.MediaWidget
    options:
      label: '{title}{s}{artist}'
      label_alt: '{title}'
      separator: ' - '
      hide_empty: true
      callbacks:
        on_left: toggle_media_menu
        on_middle: do_nothing
        on_right: do_nothing
      max_field_size:
        label: 40
        label_alt: 40
      show_thumbnail: false
      controls_only: false
      controls_left: true
      controls_hide: true
      thumbnail_alpha: 100
      thumbnail_padding: 10
      thumbnail_edge_fade: true
      icons:
        prev_track: "\uE892"
        next_track: "\uE893"
        play: "\uE768"
        pause: "\uE769"
      media_menu:
        blur: false
        round_corners: true
        round_corners_type: normal
        border_color: system
        alignment: center
        direction: down
        thumbnail_corner_radius: 20
        thumbnail_size: 100
        max_title_size: 100
        max_artist_size: 50
        show_volume_slider: false
  wallpapers:
    type: yasb.wallpapers.WallpapersWidget
    options:
      label: "<span> \uf4e5 </span>"
      tooltip: true
      image_path: "C:\\Users\\DELL\\.config\\Wallpapers"
      change_automatically: false
      update_interval: 60
      engine:
        enabled: true
        animation: circle #split/diamond/slide_top/circle
      gallery:
        image_width: 300
        image_corner_radius: 6 #only usable in default/slide/magnified orientation
        type: "magnified" #default/magnified/strip/slide
        orientation: "landscape" #landscape/portrait
        accent_color: "#ffffff" #u chan change to any color u like
      callbacks:
        on_left: "toggle_gallery"
        on_middle: "do_nothing"
        on_right: "change_wallpaper"
      keybindings:
        - keys: "ctrl+alt+w"
          action: "toggle_gallery"
          screen: "primary" #active/cursor/primary
  quick_launch:
    type: "yasb.quick_launch.QuickLaunchWidget"
    options:
      label: "<span></span>"
      search_placeholder: "Search applications..."
      max_results: 30
      show_icons: true
      icon_size: 20
      popup:
        width: 650
        height: 400
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        dark_mode: true
      callbacks:
        on_left: "toggle_quick_launch"
      keybindings:
        - keys: "alt+space"
          action: "toggle_quick_launch"
          screen: "primary"
  wifi:
    type: yasb.wifi.WifiWidget
    options:
      label: "<span>{wifi_icon}</span>"
      label_alt: "<span>{wifi_icon}</span>{wifi_name}"
      update_interval: 1000
      wifi_icons:
        - ""
        - ""
        - ""
        - ""
        - ""
  cava:
    type: "yasb.cava.CavaWidget"
    options:
      bar_height: 6
      min_bar_height: 0
      gradient: 1
      foreground: "#000000"
      gradient_color_1: '#ffffff'
      gradient_color_2: '#ffffff'
      gradient_color_3: '#ffffff'
      bars_number: 6
      bar_spacing: 1
      bar_width: 3
      bar_type: "bars"
      framerate: 144
      hide_empty: true
  lines:
    type: "yasb.custom.CustomWidget"
    options:
      label: "\u007c"
      label_alt: "\u007c"
      class_name: "separator-widget"
      callbacks:
        on_left: "do_nothing"    
  power_menu:
    type: yasb.power_menu.PowerMenuWidget
    options:
      label: "<span>\uf011</span>"
      uptime: false
      show_user: true
      menu_style: popup
      popup:
        blur: false
        direction: down ##up / down
        round_corners: true
        round_corners_type: normal  ## normal /small 
        border_color: System  ##System / none / Hex color
        alignment: right  ## left /right / center
        offset_left: 10
      profile_image_size: 50
      buttons:
        lock:
        - "\uDB80\uDF41"
        - Lock
        signout:
        - "\uDB80\uDF43"
        - Sign out
        sleep:
        - "\uDB82\uDD04"
        - Sleep
        hibernate:
        - "\uDB82\uDD01"
        - Hibernate
        restart:
        - "\uDB81\uDC53"
        - Restart
        shutdown:
        - "\uDB82\uDD06"
        - Shut Down
        cancel:
        - ''
        - Cancel
